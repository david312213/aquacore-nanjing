# 南京无人机：唯一飞行调参入口，前三终端、录点及全部任务脚本都读取本文件。
# 高度单位 m，速度 m/s，加速度 m/s²；高度相对本次起飞基准。
# common 是公共参数；mission_profiles 下 waypoint-route（fly_points.sh）、
# delivery-route（4_delivery_route.sh 比赛）分别覆盖各自的高度和速度。
# 修改在对应程序/下次任务启动时生效，飞行中不热更新；--dry-run 查看生效值。
# flight.cruise_height_m：起飞和普通航点高度，默认 1.0。
# flight.native_takeoff_*：起飞参考速度/加速度，默认 0.5 / 0.25。
# planning.max_*：航线速度/加速度，固定轨迹和 EGO 共用，默认 0.5 / 0.25。
# planning.map：分辨率、膨胀距离、虚拟上下边界；基础上限为 1.4。
# arrival_radius_m / arrival_dwell_s：XYZ 0.2 m / 0.5 s 到点判据（2026-10-30 由 0.35 改小，降落偏差更小）。
# localization / lidar：定位与雷达参数；修改需重启对应前两个终端。
# motion：原生坐标移动参考参数；比赛投放到点下降后执行一次红点开环对准。
# 本文件不写 PX4 PID 或安装标定。
# 比赛高度、速度见 mission_profiles.delivery-route；2026-10-26 确认地图上限改为 2.4。
# 两台双投舵机接 MAIN6/7，四投依次 6→7→6→7；PWM 上限 2000。
common:
  # 随第 1 终端启动；首个有效档位和换挡时各发一次，高位不发指令。
  rc_payload:
    channel: 9
    low_max_us: 1300
    high_min_us: 1700
    closed_pwm_us: 900
    open_pwm_us: 1350
  # 定位安全门（2026-10-31 确认）：随第 1 终端启动，所有任务共用。解锁且 OFFBOARD 时，
  # PX4 与 FAST-LIO 位置差 > max_error_m 并持续 hold_s，结束任务并请求当前点降落（同 safe_land.sh），
  # 不自动恢复；遥控切出 OFFBOARD 后不再请求。历史 18 次正常飞行最大 0.37 m；修改需重启第 1 终端。
  localization_gate:
    enabled: true
    max_error_m: 0.5
    hold_s: 0.5
  flight:
    controller: px4_native
    cruise_height_m: 1.42
    drop_height_m: 0.2
    native_takeoff_speed_mps: 0.5
    native_takeoff_acceleration_mps2: 0.25
    arrival_radius_m: 0.2
    arrival_dwell_s: 0.5
    # 固定航段回到降落点（HOME 或起飞 XY）专用：只看水平距离，进入后持续 arrival_dwell_s 才降落；
    # 参考结束超过 visual_alignment.motion_timeout_margin_s（与投放运动宽限共用）仍未进入，就在当时位置降落。
    home_arrival_xy_m: 0.05
    height_tolerance_m: 0.05
    height_dwell_s: 0.5
    vertical_speed_mps: 0.15
    native_task_feedback: lio
    gate_height_m: null
    drop_speed_mps: null
    recover_speed_mps: null
    native_reference_mode: lio_direct
  planning:
    virtual_boundary:
      enabled: true  # 录完场地四角后设 true；下次任务生效
      file: data/routes/field_boundary.yaml
      bottom_m: null  # 相对本次起飞点；null 向下延伸至地图边缘
      top_m: null     # null 向上延伸至地图边缘，不能从墙顶绕出
    max_velocity_mps: 0.5
    max_acceleration_mps2: 0.25
    map:
      resolution_m: 0.15
      inflation_m: 0.25
      max_height_m: 1.4
      min_height_m: -1.0
      # 地图总尺寸 X/Y/Z，单位 m；沿用原 EGO 100 × 50 × 3。
      size_x_m: 100.0
      size_y_m: 50.0
      size_z_m: 3.0
  localization:
    prediction_mode: 'replace'
    covariance_mode: source_pose
    max_imu_gap_s: 0.05
    max_prediction_horizon_s: 1.0
    pose_covariance_scale: 1.0
    pose_covariance_floor_enabled: true
    position_variance: 0.0025
    orientation_variance: 0.0025
    velocity_variance: 0.01
    angular_velocity_variance: 0.0025
  lidar:
    blind_m: 0.5
    surface_voxel_m: 0.5
    map_voxel_m: 0.5
    point_filter_num: 3
  motion:
    native_profile: waypoint
    native_setpoint_mode: position_velocity
    second_z_tolerance_m: 0.05
    native_horizontal_speed_mps: 0.1
    native_acceleration_mps2: 0.5
    first_arrival_radius_m: 0.1
    second_xy_tolerance_m: 0.05
    second_y_tolerance_m: null
  sensors:
    cameras_enabled: false
  recording:
    enabled: false
mission_profiles:
  takeoff: {}
  waypoint-route:
    # 普通航线默认连续两圈，回首点悬停；ego 恢复原逐点单遍行为。
    navigation:
      backend: fixed_min_snap
      laps: 2
      # 配时版本（fly_points.sh 用；--timing 可临时覆盖，test_loop_*.sh 固定各自版本）：
      #   original  原配时
      #   optimized 局部配时，只限速度/加速度（2026-11-15 版）
      #   thrust    局部配时，推力方向约束（2026-11-18 版，参数见下方 planning.retiming）
      timing: thrust
    # 普通航线速度/加速度，只影响 fly_points.sh；比赛航段在 delivery-route.planning 单独设置。
    # 固定轨迹按两者统一缩放时间，只提速度时加速度可能先到上限，需一起调。
    planning:
      max_velocity_mps: 6.0
      max_acceleration_mps2: 8.0
      # 过门速度：过门点（录点按 2）处及相邻过门点之间不超过此值；曲线不变，
      # 门前平滑减速、门后加速，其余路段仍用上面的速度。null 与原来一致。只影响固定轨迹。
      gate_velocity_mps: 4.0
      # 推力方向约束参数，只在 navigation.timing: thrust 时生效。
      retiming:
        feedforward_tilt_deg: 30   # 前馈倾角上限；PX4 倾角上限 45°，留 15° 给位置修正
        tilt_rate_dps: 120         # 倾转角速度上限；PX4 横滚/俯仰角速度上限 220°/s
        drag_per_s: 0.25           # 风阻按 0.25·v 计入（2026-11-18 ulog 拟合）
        max_thrust_g: 1.3          # 前馈总推力上限，单位：倍重力
    # 普通录点：1 选择 cruise，2 选择 gate，空格记录。高度相对本次起飞点。
    # 前往目标点时使用目标类型；起飞使用 cruise。门前/门中/门后均可选 gate。
    # 两套初值保持现有 1m / 0.25m，请按场地调整；地图上下界仍用 common.planning.map。
    waypoint_profiles:
      cruise:
        height_m: 1.42
        inflation_m: 0.7
      gate:
        height_m: 1.42
        inflation_m: 0.3
  delivery-route:
    # 比赛 4_delivery_route.sh、单点投放 drop_test.sh、录点投放 drop_points.sh 共用：
    # 航点之间用固定轨迹航段，到投放点或 HOME 停下，中间点连续通过，不运行 EGO。
    # 每段参考到终点后按 flight.arrival_radius_m / arrival_dwell_s 判断到点再投放。
    # 设 ego 恢复原 EGO 逐点导航和地图（三个入口一起恢复）。
    navigation:
      backend: fixed_min_snap
      # 满载绕圈段配时版本（4_delivery_route.sh 用；--no-loop-retiming 临时改为原配时）：
      #   original  原配时
      #   optimized 局部配时，只限速度/加速度（2026-11-15 版，比赛现用）
      #   thrust    局部配时，推力方向约束（2026-11-18 版，参数见下方 planning.retiming）
      # 投放之间、回 HOME 航段，以及 drop_test.sh / drop_points.sh 不做局部配时。
      timing: thrust
    payload:
      pd_profiles_enabled: false
      sequence:
      - 1
      - 2
      - 3
      - 4
      # 飞控当前校准量程；机构关闭区间 800～980，默认关闭取 900。
      pwm_min_us: 900
      pwm_center_us: 1450
      pwm_max_us: 2000
      pwm_command_max_us: 2000
      reset_pwm_us: 900
      locked_pwm_us: 900
      released_pwm_us: 1190
      settle_s: 1.0
      ack_timeout_s: 5.0
      release_dwell_s: 0.0
      release_max_speed_mps: null
      # 逻辑投放 1～4：MAIN6 第一档、MAIN7 第一档、MAIN6 第二档、MAIN7 第二档。
      actuator_indices:
        '1': 1
        '2': 2
        '3': 1
        '4': 2
      main_outputs:
        '1': 6
        '2': 7
        '3': 6
        '4': 7
      pwm_max_us_by_slot: {}
      released_pwm_us_by_slot:
        '1': 1400
        '2': 1500
        '3': 1999
        '4': 1999
    delivery_route_options:
      # 巡航闭环圈数 N（2026-11-19 起）：分段航线 = 进场点 → 巡航闭环 N 圈 → 投放环 → 返航点 → HOME；
      # 旧的共用一套点航线 = 满载绕 N 圈后第 N+1 圈投放（原 laps=9 的飞法现在写 8）；0 = 第一圈边飞边投。
      # 只影响 4_delivery_route.sh；单点、录点投放测试没有圈数。
      laps: 2
      visual_alignment:
        red_point_config: ${PROJECT}/flight/red_point.yaml
        intermediate_height_m: 0.5  # 定位 Z；到投放点后直接下降至此识别红点
        frame_timeout_s: 4.0          # 每次取图独立计时；空结果不刷新
        motion_timeout_margin_s: 2.0  # 参考轨迹结束后的到位宽限
        retake_limit: 1                # 每个投放点一次额外重拍
        retry_xy_relax_m: 0.08         # 重拍后 XY 各增加，Z 不变、不累计
      # 回 HOME 后 H 标两次对准再降落：高处识别 → 下降至 intermediate_height_m 再识别 →
      # 下降至 final_height_m 后交 AUTO.LAND 触地上锁。不重拍；每次取图超时即在当前 XY 直接下降。
      landing_alignment:
        enabled: false
        frame_timeout_s: 3.0           # 每次等 H 图像的时间，含识别进程启动
        final_height_m: 0.15           # 相对本次起飞基准；到此高度请求 AUTO.LAND
        final_speed_mps: 0.30          # 末段下降速度，与原降落速度一致
      # 每口 [前, 左] 米；当前零偏移，无额外补偿动作。
      mount_offsets_body_m:
        '1':
        - -0.02
        - -0.1
        '2':
        - -0.02
        - 0.06
        '3':
        - 0.0
        - -0.06
        '4':
        - 0.0
        - 0.06
    flight:
      cruise_height_m: 1.42
      drop_height_m: 0.20
      gate_height_m: 1.44
      drop_speed_mps: 0.60
      recover_speed_mps: 2.0
    planning:
      # 固定航段速度/加速度：比赛和两个投放测试共用；对准、下降、回升另有参数。
      # 与普通航线一样两者一起调：加速度约需 0.6 × 速度²，否则会先到加速度上限。
      max_velocity_mps: 6.0
      max_acceleration_mps2: 8.0
      # 圆环段（gate）速度：与普通航线的过门速度相同规则；null 不单独限速。只影响固定轨迹。
      gate_velocity_mps: 4.0
      # 推力方向约束参数，只在 navigation.timing: thrust 时生效。
      retiming:
        feedforward_tilt_deg: 30   # 前馈倾角上限；PX4 倾角上限 45°，留 15° 给位置修正
        tilt_rate_dps: 120         # 倾转角速度上限；PX4 横滚/俯仰角速度上限 220°/s
        drag_per_s: 0.25           # 风阻按 0.25·v 计入（2026-11-18 ulog 拟合）
        max_thrust_g: 1.3          # 前馈总推力上限，单位：倍重力
      map:
        resolution_m: 0.18
        inflation_m: 0.36
        max_height_m: 2.4
        min_height_m: -1.0
    motion:
      native_horizontal_speed_mps: 0.1
      # 对准、投放口补偿、下降（含降到识别高度）的参考加速度，m/s²；--align-acceleration
      native_acceleration_mps2: 0.5
      # 投放后回升的参考加速度，m/s²；null = 沿用上面的对准加速度；--recover-acceleration
      # 回升速度 recover_speed_mps 较大时需同时调大此值，否则加速不到设定速度。
      recover_acceleration_mps2: null
